# Ambiente local equivalente ao Railway: Java + PostgreSQL 18
# Utilização: docker compose -f deploy/railway/docker-compose.yml up --build

services:
  postgres:
    image: postgres:18-alpine
    container_name: ipma-postgres
    environment:
      POSTGRES_DB: recrutamento
      POSTGRES_USER: recrutamento
      POSTGRES_PASSWORD: recrutamento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recrutamento -d recrutamento"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/railway/Dockerfile
    container_name: ipma-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recrutamento
      SPRING_DATASOURCE_USERNAME: recrutamento
      SPRING_DATASOURCE_PASSWORD: recrutamento
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8081:8080"

volumes:
  pgdata:
